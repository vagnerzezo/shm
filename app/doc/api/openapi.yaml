openapi: 3.1.0
info:
  title: SHM API
  version: 1.0.0
  description: >
    API do Studio Heitor Macks para o site e o app de celular (cliente e barbeiro).
    Datas em AAAA-MM-DD, horas em HH:MM (fuso America/Sao_Paulo), instantes em ISO 8601.
    Rotas com login aceitam `Authorization: Bearer <token>` (app) ou o cookie de sessão do site.
servers:
  - url: /api/v1
tags:
  - name: Studio
  - name: Auth
  - name: Conta
  - name: Catalog
  - name: Reservations
  - name: Messages
  - name: Barber
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation, unauthenticated, invalid_credentials, forbidden, account_disabled, not_found, email_taken, slot_unavailable, rate_limited, internal]
            message:
              type: string
              description: Texto em português para mostrar à pessoa.
            fields:
              type: object
              additionalProperties: { type: string }
              description: Mensagem por campo, quando o erro é de um campo.
      example:
        error: { code: slot_unavailable, message: Esse horário não está mais disponível. }
    Studio:
      type: object
      required: [name, address, phone]
      properties:
        name: { type: string }
        address: { type: array, items: { type: string }, maxItems: 3 }
        phone: { type: string }
        email: { type: string }
        social:
          type: object
          properties:
            instagram: { type: string }
            facebook: { type: string }
            linkedin: { type: string }
      example:
        name: Studio Heitor Macks
        address: ["R. João XXIII, 32 Sala 1601", "São José, São Leopoldo", "RS, 93040-090, Brasil"]
        phone: "51999991234"
    User:
      type: object
      required: [id, name, phone, email, role, consent]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string, description: Só dígitos, com DDD. }
        email: { type: string }
        role: { type: string, enum: [cliente, barbeiro, admin] }
        consent:
          type: object
          description: Autorizações para comunicações de marketing.
          required: [email, mensagem]
          properties:
            email: { type: boolean }
            mensagem: { type: boolean }
        professional:
          type: string
          description: Nome do profissional ligado à conta (barbeiro, ou admin que também atende).
      example:
        id: 3f2a9c1e-8b7d-4e21-9a6f-1c2d3e4f5a6b
        name: Ana Souza
        phone: "51999991234"
        email: ana@exemplo.com
        role: cliente
        consent: { email: true, mensagem: false }
    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, description: Enviar em `Authorization Bearer`. Vale 30 dias e se renova com o uso. }
        expiresAt: { type: integer, description: Validade em milissegundos (epoch). }
        user: { $ref: "#/components/schemas/User" }
      example:
        token: 9b1f0c7e5a3d2e8f4c6b1a0d9e8f7c6b5a4d3e2f1c0b9a8d7e6f5c4b3a2d1e0f
        expiresAt: 1797465600000
        user: { id: 3f2a9c1e-8b7d-4e21-9a6f-1c2d3e4f5a6b, name: Ana Souza, phone: "51999991234", email: ana@exemplo.com, role: cliente, consent: { email: true, mensagem: false } }
    ProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string, description: "WhatsApp com DDD (10 ou 11 dígitos; outros caracteres são ignorados). Um +55 na frente é removido." }
        email: { type: string, maxLength: 120 }
        consent:
          type: object
          description: "Autorizações de contato. No `PATCH /me`, só as chaves enviadas mudam. Valor que não seja booleano dá `400` no campo `consent`."
          properties:
            email: { type: boolean }
            mensagem: { type: boolean }
    Service:
      type: object
      required: [id, name, durationMinutes, priceCents, professional]
      properties:
        id: { type: string }
        name: { type: string }
        durationMinutes: { type: integer }
        priceCents: { type: integer, description: Preço em centavos de real. }
        professional:
          type: [string, "null"]
          description: Profissional fixo do serviço; `null` quando qualquer profissional livre atende.
      example: { id: corte-heitor, name: Corte com Heitor, durationMinutes: 45, priceCents: 7000, professional: Heitor }
    Availability:
      type: object
      required: [serviceId, days]
      properties:
        serviceId: { type: string }
        days:
          type: array
          description: Um item por dia do intervalo, em ordem. Dia fechado, passado ou cheio vem com `times` vazio.
          items:
            type: object
            required: [date, times]
            properties:
              date: { type: string, format: date }
              times: { type: array, items: { type: string, example: "09:30" } }
      example:
        serviceId: corte-heitor
        days:
          - { date: "2026-11-25", times: ["09:00", "09:30", "10:00"] }
          - { date: "2026-11-26", times: [] }
    Reservation:
      type: object
      required: [id, date, time, endTime, status, service]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        time: { type: string, example: "10:00" }
        endTime: { type: string, example: "10:45", description: Hora de término (início + duração do serviço). }
        status:
          type: string
          enum: [agendado, realizado, faltou]
          description: "`agendado`: ainda não aconteceu. Depois do horário: `realizado`, ou `faltou` se o estúdio marcou falta."
        note: { type: string, maxLength: 300, description: Observação do cliente. Ausente quando não há. }
        service:
          allOf: [{ $ref: "#/components/schemas/Service" }]
          description: Como foi marcado. `priceCents` é o preço cobrado na reserva; `professional` é quem atende.
      example:
        id: 7c1e2d3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
        date: "2026-11-25"
        time: "10:00"
        endTime: "10:45"
        status: agendado
        note: Primeira vez
        service: { id: corte-heitor, name: Corte com Heitor, durationMinutes: 45, priceCents: 7000, professional: Heitor }
    BookingItem:
      type: object
      required: [serviceId, date, time]
      properties:
        serviceId: { type: string }
        date: { type: string, format: date }
        time: { type: string, example: "10:00" }
    Message:
      type: object
      required: [id, from, text, createdAt]
      properties:
        id: { type: string }
        from: { type: string, enum: [cliente, admin], description: "`cliente`: enviada pelo cliente; `admin`: pelo estúdio." }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, description: Quando o destinatário abriu a conversa. Ausente enquanto não lida. }
        authorName: { type: string, description: "Primeiro nome de quem da equipe escreveu (só em mensagens `admin`). Ausente: mostrar \"Estúdio\"." }
      example: { id: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a, from: cliente, text: "Posso levar meu filho junto?", createdAt: "2026-11-18T22:10:00.000Z" }
    BarberReservation:
      type: object
      description: Horário visto pelo barbeiro. Sem preço e sem o e-mail do cliente.
      required: [id, date, time, endTime, status, attendance, service, customer]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        time: { type: string, example: "10:00" }
        endTime: { type: string, example: "10:45" }
        status: { type: string, enum: [agendado, realizado, faltou] }
        attendance:
          type: [string, "null"]
          enum: [compareceu, faltou, null]
          description: O que foi marcado. `null` = não marcado (depois do horário conta como realizado).
        note: { type: string, description: Observação do cliente. Ausente quando não há. }
        service:
          type: object
          required: [id, name, durationMinutes]
          properties:
            id: { type: string }
            name: { type: string }
            durationMinutes: { type: integer }
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string, description: Só dígitos, com DDD. }
      example:
        id: 7c1e2d3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
        date: "2026-11-17"
        time: "10:00"
        endTime: "10:45"
        status: faltou
        attendance: faltou
        service: { id: corte-heitor, name: Corte com Heitor, durationMinutes: 45 }
        customer: { name: Ana Souza, phone: "51999991234" }
  responses:
    Error:
      description: Erro no formato padrão.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /services:
    get:
      tags: [Catalog]
      summary: Serviços ativos, por categoria
      responses:
        "200":
          description: Categorias na ordem do catálogo.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [name, services]
                      properties:
                        name: { type: string }
                        services: { type: array, items: { $ref: "#/components/schemas/Service" } }
  /availability:
    get:
      tags: [Catalog]
      summary: Horários livres de um serviço
      description: >
        Público. Com login, as reservas do próprio cliente também ocupam o horário (ele não está
        em dois lugares). Até 31 dias por consulta.
      security: [{}, { bearer: [] }]
      parameters:
        - { name: serviceId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: Inclusive; no máximo 30 dias depois de `from`. }
        - name: rescheduleOf
          in: query
          schema: { type: string }
          description: Id de uma reserva do cliente logado que vai ser remarcada; ela não conta como ocupada. Exige login.
      responses:
        "200":
          description: Horários por dia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /studio:
    get:
      tags: [Studio]
      summary: Dados do estúdio
      responses:
        "200":
          description: Nome, endereço e contatos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Studio" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Entrar
      description: >
        E-mail inexistente e senha errada devolvem o mesmo erro. Depois de 10 erros em 15 minutos
        para o mesmo e-mail, responde 429 até o prazo passar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
            example: { email: cliente@exemplo.com, password: minha-senha }
      responses:
        "200":
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Sair (encerra a sessão atual)
      security: [{ bearer: [] }]
      responses:
        "204": { description: Sessão encerrada. }
        "401": { $ref: "#/components/responses/Error" }
  /auth/register:
    post:
      tags: [Auth]
      summary: Criar conta de cliente
      description: Envia o e-mail de boas-vindas. Avisa se o e-mail já está em uso (409). Até 10 cadastros por hora vindos do mesmo IP, contando os recusados por e-mail em uso (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ProfileInput" }
                - type: object
                  required: [name, phone, email, password]
                  properties:
                    password: { type: string, minLength: 8, maxLength: 100 }
      responses:
        "201":
          description: Conta criada, já com sessão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Pedir o link de redefinição de senha
      description: Responde 204 exista ou não uma conta com o e-mail. O link vale 1 hora; até 3 pedidos por hora.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "204": { description: Pedido aceito. }
        "400": { $ref: "#/components/responses/Error" }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Definir nova senha com o código do e-mail
      description: Encerra todas as sessões da conta. Depois, entre com a senha nova.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: Código que veio no link do e-mail. }
                password: { type: string, minLength: 8, maxLength: 100 }
      responses:
        "204": { description: Senha trocada. }
        "400": { $ref: "#/components/responses/Error" }
  /me/password:
    post:
      tags: [Conta]
      summary: Trocar a própria senha
      description: Encerra as outras sessões; a atual continua valendo.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current: { type: string }
                password: { type: string, minLength: 8, maxLength: 100 }
      responses:
        "204": { description: Senha trocada. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /me:
    patch:
      tags: [Conta]
      summary: Atualizar os próprios dados
      description: Campos não enviados ficam como estão.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Dados atualizados.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Conta]
      summary: Excluir a própria conta (LGPD)
      description: Só para clientes. Apaga a conta, as reservas, as mensagens e as sessões. Não tem volta.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Conta excluída. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [Conta]
      summary: Dados do usuário logado
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usuário.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /reservations:
    get:
      tags: [Reservations]
      summary: Reservas do cliente logado
      description: Canceladas não aparecem. `upcoming` em ordem cronológica; `past` da mais recente para a mais antiga.
      security: [{ bearer: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [upcoming, past], default: upcoming } }
      responses:
        "200":
          description: Reservas.
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations: { type: array, items: { $ref: "#/components/schemas/Reservation" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Reservations]
      summary: Marcar um ou mais horários
      description: >
        Só para clientes. Tudo ou nada: se um item não puder ser marcado, nenhum é gravado.
        Sem chave de idempotência — repetir o mesmo pedido dá `409`, porque o cliente já ocupa o horário.
        Envia o e-mail de confirmação depois da resposta.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/BookingItem" }, description: Sem item repetido e sem itens que se sobreponham entre si (os dois casos dão `400` em `fields.items`). }
                note: { type: string, maxLength: 300, description: "Vale para todos os itens. Espaços nas pontas são removidos e uma quebra de linha conta como 1 caractere. Acima de 300 dá `400` no campo `note` (o texto nunca é cortado)." }
      responses:
        "201":
          description: Reservas criadas, na ordem dos itens.
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations: { type: array, items: { $ref: "#/components/schemas/Reservation" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "Um dos horários não está mais livre (`slot_unavailable`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /reservations/{id}:
    patch:
      tags: [Reservations]
      summary: Remarcar uma reserva futura
      description: Só o dono. Avisa o estúdio pelo chat, na mesma transação da remarcação. Reserva de outro cliente, cancelada ou inexistente dá `404`.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, time]
              properties:
                date: { type: string, format: date }
                time: { type: string, example: "16:00" }
      responses:
        "200":
          description: Reserva com o novo horário.
          content:
            application/json:
              schema:
                type: object
                required: [reservation]
                properties:
                  reservation: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /reservations/{id}/cancel:
    post:
      tags: [Reservations]
      summary: Cancelar uma reserva futura
      description: Só o dono. A reserva fica no histórico do estúdio e some da lista do cliente. Envia o e-mail de cancelamento.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cancelada. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /messages:
    get:
      tags: [Messages]
      summary: Conversa do cliente com o estúdio
      description: >
        Só para clientes. Em ordem cronológica. Com `after`, só as mensagens depois dessa
        (o app usa para buscar o que chegou); id desconhecido devolve a conversa inteira.
      security: [{ bearer: [] }]
      parameters:
        - { name: after, in: query, schema: { type: string }, description: Id da última mensagem que o app já tem. }
      responses:
        "200":
          description: Mensagens e quantas do estúdio o cliente ainda não leu.
          content:
            application/json:
              schema:
                type: object
                required: [messages, unread]
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  unread: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Messages]
      summary: Enviar mensagem ao estúdio
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000, description: Espaços nas pontas são removidos; não pode ficar vazio. }
      responses:
        "201":
          description: Mensagem enviada.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /messages/read:
    post:
      tags: [Messages]
      summary: Marcar como lidas as mensagens do estúdio
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Quantas mudaram.
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /barber/agenda:
    get:
      tags: [Barber]
      summary: Agenda do próprio profissional
      description: >
        Conta de barbeiro, ou admin ligado a um profissional ("Sou eu"). Só os horários
        atendidos por esse profissional (inclui serviços sem profissional fixo atribuídos a ele),
        sem os cancelados, em ordem. Até 31 dias por consulta.
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: Inclusive; no máximo 30 dias depois de `from`. }
      responses:
        "200":
          description: Horários.
          content:
            application/json:
              schema:
                type: object
                required: [professional, reservations]
                properties:
                  professional: { type: string }
                  reservations: { type: array, items: { $ref: "#/components/schemas/BarberReservation" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /barber/reservations/{id}/attendance:
    put:
      tags: [Barber]
      summary: Marcar compareceu ou faltou
      description: >
        Só reservas do próprio profissional (de outro, ou inexistente, dá `404`) e só depois do
        horário. Reserva futura ou cancelada dá `400`. `null` desfaz.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendance]
              properties:
                attendance: { type: [string, "null"], enum: [compareceu, faltou, null] }
      responses:
        "204": { description: Marcado. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
